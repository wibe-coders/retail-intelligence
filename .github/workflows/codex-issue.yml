name: Codex issue implementation

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: codex-issue-${{ github.repository_id }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.event.issue.state == 'open' &&
      (github.event.label.name == 'auto' || github.event.label.name == 'supervised') &&
      contains(fromJSON('["varun10p", "VishnuKartha", "visirion07", "nTamilselvan"]'), github.actor) &&
      contains(fromJSON('["varun10p", "VishnuKartha", "visirion07", "nTamilselvan"]'), github.event.issue.user.login)
    runs-on: [self-hosted, Linux, X64, retail-intelligence-codex]
    timeout-minutes: 180
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPOSITORY: ${{ github.repository }}
      RUN_MODE: ${{ contains(github.event.issue.labels.*.name, 'supervised') && 'supervised' || 'auto' }}

    steps:
      - name: Check out main without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare issue branch and rebase onto main
        run: bash .github/codex/issue-runner.sh prepare

      - name: Implement and verify the issue
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: bash .github/codex/issue-runner.sh run

      - name: Restore protected automation files
        if: always()
        shell: bash
        run: |
          if [[ -n $(git status --short -- .github/workflows .github/codex) ]]; then
            printf '%s\n' changed >"$RUNNER_TEMP/codex-protected-change"
          fi
          git restore --source=HEAD --staged --worktree -- .github/workflows .github/codex
          git clean -fd -- .github/workflows .github/codex

      - name: Push result and report status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/codex/issue-runner.sh publish
